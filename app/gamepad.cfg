// gamepad.cfg: a console shooter's layout for an SDL game controller (DualShock names, Xbox in brackets).
// The game adds it to the config once, so rebinding in Setup > Controls sticks. The menus take the D-pad,
// Cross [A] to choose, Circle [B] or Share [Back] to go back, and Options [Start] opens and closes them
// (ioquake3 patch 0002).

seta in_joystick "1"
seta in_joystickUseAnalog "1"
seta joy_threshold "0.15"

// sticks, analog: the left one walks, the right one looks; full tilt turns 234 deg/s and pitches 162 (a
// tenth under the first layout's 260 and 180, which played too quick; a quarter under played too slow)
seta j_forward_axis "1"
seta j_side_axis "0"
seta j_yaw_axis "2"
seta j_pitch_axis "3"
seta j_forward "-0.25"
seta j_side "0.25"
seta j_yaw "-0.0072"
seta j_pitch "0.00495"
bind PAD0_LEFTSTICK_UP "+forward"
bind PAD0_LEFTSTICK_DOWN "+back"
bind PAD0_LEFTSTICK_LEFT "+moveleft"
bind PAD0_LEFTSTICK_RIGHT "+moveright"
bind PAD0_RIGHTSTICK_LEFT "+left"
bind PAD0_RIGHTSTICK_RIGHT "+right"
bind PAD0_RIGHTSTICK_UP "+lookup"
bind PAD0_RIGHTSTICK_DOWN "+lookdown"

// R2 [RT] fires, L2 [LT] zooms
bind PAD0_RIGHTTRIGGER "+attack"
bind PAD0_LEFTTRIGGER "+zoom"

// R1/L1 [RB/LB] and Triangle [Y] change weapons
bind PAD0_RIGHTSHOULDER "weapnext"
bind PAD0_LEFTSHOULDER "weapprev"
bind PAD0_Y "weapnext"

// Cross [A] jumps, Circle [B] crouches, Square [X] uses the item held
bind PAD0_A "+moveup"
bind PAD0_B "+movedown"
bind PAD0_X "+button2"

// D-pad: up and down swim or jump and crouch, left and right change weapons
bind PAD0_DPAD_UP "+moveup"
bind PAD0_DPAD_DOWN "+movedown"
bind PAD0_DPAD_LEFT "weapprev"
bind PAD0_DPAD_RIGHT "weapnext"

// L3 walks, R3 looks straight ahead, Share [Back] shows the scores
bind PAD0_LEFTSTICK_CLICK "+speed"
bind PAD0_RIGHTSTICK_CLICK "centerview"
bind PAD0_BACK "+scores"
